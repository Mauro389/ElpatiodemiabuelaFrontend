<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patio Campestre</title>
    <link rel="stylesheet" href="../../shared/models/styles/login.css">
    <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico"><!-- Icono en la pestaña del navegador -->
</head>

<body>
    <div class="contenedor-login">
        <div class="caja-formulario">
            <img class="logo-login" src="../../assets/icons/logo_patio.png" alt="logo patio campestre">
            <h1 class="titulo-login">Iniciar Sesión</h1>
            <p class="mensaje-error"></p> <!-- Mensaje de error, se muestra solo si hay un error de inicio de sesión -->
            <p class="subtitulo-login">Bienvenido al Patio Campestre</p>
            <input class="campo-usuario" type="text" placeholder="Usuario">
            <input class="campo-password" type="password" placeholder="Contraseña">
            <button class="btn-entrar">Iniciar Sesión</button>
        </div>
    </div>
</body>
<script src="login.js"></script>

</html>
